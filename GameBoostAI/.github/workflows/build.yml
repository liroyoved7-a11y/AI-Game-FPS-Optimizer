name: Build GameBoost AI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows EXE
        run: dotnet publish GameBoostAI/GameBoostAI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GameBoostAI-Windows
          path: release/
